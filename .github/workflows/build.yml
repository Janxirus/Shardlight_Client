name: Build

# Every pull request and every push to main is built and tested on Linux and Windows.
# Windows also produces the app folder (with its own Java runtime) and the MSI installer; the Installers workflow
# adds the macOS .dmg and the Linux .deb and .rpm. Each package is started once with --capture to prove it runs.
# Signing happens only when the signing secrets exist (docs/RELEASING.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Distributor values baked into the build (all optional; see docs/SIGN_IN.md and docs/RELEASING.md).
# Set them under the repository's Settings > Secrets and variables > Actions. Without them the app still
# builds and runs; sign-in, CurseForge and update checks then explain what is missing.
env:
  SHARDLIGHT_MSA_CLIENT_ID: ${{ vars.SHARDLIGHT_MSA_CLIENT_ID }}
  SHARDLIGHT_DISCORD_APP_ID: ${{ vars.SHARDLIGHT_DISCORD_APP_ID }}
  SHARDLIGHT_UPDATE_MANIFEST_URL: ${{ vars.SHARDLIGHT_UPDATE_MANIFEST_URL }}
  SHARDLIGHT_UPDATE_PUBLIC_KEY: ${{ vars.SHARDLIGHT_UPDATE_PUBLIC_KEY }}
  SHARDLIGHT_CURSEFORGE_API_KEY: ${{ secrets.SHARDLIGHT_CURSEFORGE_API_KEY }}

jobs:
  linux:
    name: Linux build, tests and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Build and test
        run: |
          chmod +x gradlew
          xvfb-run -a ./gradlew build :launcher-app:portableZip --stacktrace

      - name: Screenshot every view in every look
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" ./gradlew :launcher-app:run \
            --args="--capture ${{ runner.temp }}/screens --capture-matrix --data-dir ${{ runner.temp }}/capture-data"
          echo "Screenshots: $(find '${{ runner.temp }}/screens' -name '*.png' | wc -l)"

      - name: Startup time and memory
        run: |
          ./gradlew :launcher-app:installDist
          tools/perf/measure.sh launcher-app/build/install/shardlight-client 5 | tee "${{ runner.temp }}/perf.txt"
          {
            echo '### Startup time and idle memory (Linux runner, software rendering; see docs/PERFORMANCE.md)'
            echo '```'
            cat "${{ runner.temp }}/perf.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/'

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ShardlightClient-portable-${{ github.sha }}
          path: launcher-app/build/distributions/*-portable.zip
          if-no-files-found: error

      - name: Upload screenshots (dark, light and high contrast, at 100% and 150%)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/screens/
          if-no-files-found: error

  windows:
    name: Windows build, tests, app and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: pwsh
        run: ./gradlew.bat build --stacktrace

      - name: App folder with its own Java runtime
        shell: pwsh
        run: |
          ./gradlew.bat :launcher-app:jpackageImage --stacktrace
          $ver = (Select-String -Path gradle.properties -Pattern '^launcher_version=(.*)$').Matches[0].Groups[1].Value
          Compress-Archive -Path "launcher-app/build/jpackage/image/Shardlight Client" -DestinationPath "launcher-app/build/ShardlightClient-$ver-windows-x64.zip"

      - name: Install WiX Toolset 3 for the MSI
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
            if ($wix) { Add-Content $env:GITHUB_PATH (Join-Path $wix.FullName 'bin') }
          }

      - name: MSI installer
        shell: pwsh
        run: ./gradlew.bat :launcher-app:jpackageInstaller --stacktrace

      - name: Shardlight pictures in the installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem launcher-app/build/jpackage/installer/*.msi | Select-Object -First 1
          ./tools/release/set_msi_images.ps1 -Msi $msi.FullName -Banner packaging/windows/banner.bmp -Dialog packaging/windows/dialog.bmp

      - name: Start the app folder once
        shell: pwsh
        run: |
          $exe = (Resolve-Path "launcher-app/build/jpackage/image/Shardlight Client/Shardlight Client.exe").Path
          $work = Join-Path $env:RUNNER_TEMP "prove"
          $p = Start-Process -FilePath $exe -ArgumentList @('--capture', "$work\screens", '--data-dir', "$work\data") -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "the packaged app did not finish in five minutes" }
          $count = (Get-ChildItem "$work\screens" -Filter *.png -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "The packaged app drew $count pages."
          if ($count -lt 20) { Get-ChildItem "$work\data\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }; throw "expected at least 20 pictures, got $count" }

      - name: Is there a signing certificate?
        id: sign
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERT -and $env:CERT_PASSWORD) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice title=Windows signing skipped::No code-signing certificate is configured, so the MSI is not signed (docs/RELEASING.md)."
            "Windows signing: **skipped** (no certificate configured)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Sign the MSI
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./tools/release/sign_windows.ps1 -Folder launcher-app/build/jpackage/installer

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: '**/build/reports/tests/'

      - name: Upload Windows app folder
        uses: actions/upload-artifact@v4
        with:
          name: ShardlightClient-windows-x64-${{ github.sha }}
          path: launcher-app/build/ShardlightClient-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ShardlightClient-msi-${{ github.sha }}
          path: launcher-app/build/jpackage/installer/*.msi
          if-no-files-found: error

  installers:
    name: macOS and Linux installers
    uses: ./.github/workflows/installers.yml
    secrets: inherit
