name: Live tests

# Checks that talk to the real services: the Modrinth, CurseForge, GitHub and Mojang APIs, and the real Forge and
# NeoForge installers. They are not part of `./gradlew build` and the Build workflow never waits for them, so a
# service outage can't block a pull request (don't add these jobs to the required checks). They also run every
# Monday on the default branch, which is how a changed API or a renamed Minecraft option gets noticed.
on:
  pull_request:
    paths:
      - 'launcher-core/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/live-tests.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Real APIs (Modrinth, CurseForge, GitHub, Minecraft 26.3 options)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The CurseForge tests are skipped when the secret is not set (and always for pull requests from forks).
      - name: Contract tests against the real services
        env:
          SHARDLIGHT_CURSEFORGE_API_KEY: ${{ secrets.SHARDLIGHT_CURSEFORGE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :launcher-core:liveTest -PliveTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-api-reports
          path: launcher-core/build/reports/tests/liveTest/

  installers:
    name: Forge and NeoForge installers (Minecraft 26.3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Forge and NeoForge with their real installers
        run: |
          chmod +x gradlew
          ./gradlew :launcher-core:installerTest -PinstallerTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-installer-reports
          path: launcher-core/build/reports/tests/installerTest/
