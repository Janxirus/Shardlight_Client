name: Bug report
description: Something in Shardlight Client doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste passwords, access tokens or API keys here.
        The launcher's diagnostics export (Settings > Diagnostics) already removes them.
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Shown in Settings > About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project setup
      description: Minecraft version, mod loader and loader version of the project, if it's about a project.
      placeholder: 26.3, Fabric 0.19.5
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or logs
      description: Attach the zip from Settings > Diagnostics > Export, or paste the relevant part of the log.
      render: text
