# Launcher self-update configuration (see docs/RELEASING.md).
#
# Both values are empty in the source tree, so update checks are switched off with a clear reason.
# The distributor fills them in for release builds:
#   manifestUrl - https address of the signed update manifest. "{channel}" in it is replaced by the
#                 update channel (stable or beta), for example
#                 https://example.org/shardlight-client/{channel}.json
#   publicKey   - the Ed25519 public key that verifies the manifest signature: one line of base64
#                 (X.509 SubjectPublicKeyInfo DER, 44 bytes) or a 32-byte raw key in base64 or hex.
#                 Never put the private key here or anywhere in the repository.
manifestUrl=
publicKey=
