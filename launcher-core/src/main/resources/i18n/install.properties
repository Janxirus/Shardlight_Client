diagnostics.jvm.detail=Check the extra Java arguments and the memory in the project''s Java settings, or let Shardlight Client pick Java automatically.
diagnostics.mixin.title={0} couldn''t change the game
diagnostics.mixin.detail={0} probably isn''t made for this Minecraft or loader version, or it clashes with another mod. Update it, or disable it and try again.
diagnostics.mixin.detailUnknown=A mod couldn''t change the game code. It probably isn''t made for this Minecraft or loader version. Disable recently added or updated mods and try again.
diagnostics.duplicate.title=The same mod is installed twice
diagnostics.duplicate.detail=Two files provide the same mod ({0}). Keep only the newest one in the project''s Mods list.
diagnostics.damaged.title=A file is damaged
