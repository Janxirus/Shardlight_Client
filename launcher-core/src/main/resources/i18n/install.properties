diagnostics.damaged.detailUnknown=A game or mod file couldn''t be read. Repair the project, or reinstall recently added mods.
diagnostics.nativeCrash.title=The game''s Java crashed
diagnostics.nativeCrash.detail=This usually comes from a graphics driver, an overlay program (recording, FPS counters, RGB tools) or a mod with native code. Update your graphics driver, close overlays and try again.
diagnostics.nativeCrash.detailLibrary=Java crashed inside {0}. If that belongs to a program or mod, update or close it. Updating your graphics driver also often helps.
