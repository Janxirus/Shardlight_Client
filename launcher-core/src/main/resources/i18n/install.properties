diagnostics.memory.detail=Raise the maximum memory in the project''s Java settings, or use fewer or lighter mods, resource packs or shaders.
diagnostics.heap.title=Java couldn''t start with this much memory
diagnostics.heap.detail=Lower the maximum memory in the project''s Java settings. A 32-bit Java can''t use more than about 1.5 GB, so a 64-bit Java is best.
diagnostics.jvmOption.title=Java didn''t accept the option {0}
diagnostics.jvmOption.detail=Remove {0} from the extra Java arguments in the project''s Java settings.
