diagnostics.graphics.detail=Update your graphics driver from the maker''s website (NVIDIA, AMD or Intel). On laptops, make sure Java uses the dedicated graphics card.
diagnostics.fabricApi.title=A mod needs Fabric API
diagnostics.fabricApi.detail=Install Fabric API for this Minecraft version from Discover. Most Fabric mods need it.
diagnostics.missingClass.title=A mod is missing code it needs
diagnostics.missingClass.detail=The game couldn''t find {0}. Usually a mod that another mod depends on is missing or is the wrong version. Check the required mods on each mod''s page.
