# Microsoft sign-in, Xbox Live, Minecraft ownership and the account list. English is the base language.
# Messages with {0} placeholders are read with java.text.MessageFormat: write apostrophes as two single
# quotes there. Messages without placeholders are shown as written, so they avoid apostrophes entirely
# (that way they read correctly whichever way they are formatted).

# ---- sign-in screen
auth.signIn.title=Sign in with Microsoft
auth.signIn.instructions=Open {0} in any browser and enter this code: {1}
auth.signIn.waiting=Waiting for you to finish signing in on the Microsoft page...
auth.signIn.copyCode=Copy code
auth.signIn.openLink=Open the sign-in page
auth.signIn.noPassword=Shardlight Client never sees your password: you sign in on the Microsoft website itself.
auth.signIn.success=Signed in as {0}.
auth.signIn.notConfiguredHint=Sign-in needs a Microsoft app ID. Add it in Settings > Accounts (see docs/SIGN_IN.md).
auth.signOut=Sign out
auth.signOut.confirm=Sign out {0}? You can sign in again at any time.
auth.account.select=Use this account
auth.account.add=Add a Microsoft account
auth.account.none=No account signed in yet.
auth.account.signInAgain=Sign in again
auth.account.notOwned=No Minecraft: Java Edition on this account

# ---- where sign-ins are kept
auth.store.windows=Windows Data Protection
auth.store.mac=macOS Keychain
auth.store.linux=Secret Service (GNOME Keyring or KWallet)
auth.store.memory=Memory only
auth.store.notRemembered=No secure password store is available on this computer, so your sign-in will be forgotten when Shardlight Client closes.

# ---- errors
auth.error.notConfigured=Microsoft sign-in is not set up in this copy of Shardlight Client. Whoever distributes it must register a Microsoft app and enter its client ID in Settings > Accounts.
auth.error.clientRejected=Microsoft didn''t accept this launcher''s app ID ({0}). Check the client ID in Settings > Accounts, and that the app is a public client that allows device-code sign-in for personal Microsoft accounts.
auth.error.appNotApproved=Minecraft did not accept the Microsoft app this launcher signs in with. The app has to be approved for Minecraft sign-in first (https://aka.ms/mce-reviewappid).
auth.error.declined=Sign-in was declined on the Microsoft page. Start again if that was not intended.
auth.error.codeExpired=The sign-in code expired before it was used. Start sign-in again to get a new code.
auth.error.sessionExpired=Your saved Microsoft sign-in has expired or was revoked. Please sign in again.
auth.error.signInAgain=The saved sign-in for {0} has expired or was revoked. Please sign in again.
auth.error.appChanged={0} signed in with a different Microsoft app ID than the one this launcher uses now, so the saved sign-in can''t be renewed. Please sign in again.
auth.error.offlineNotAllowed=Playing offline needs an account that was confirmed to own Minecraft in the last 30 days. Connect to the internet and sign in with {0} once.
auth.error.microsoft=Microsoft sign-in failed ({0}). Please try again.
auth.error.xboxAuth=Xbox Live didn''t accept the sign-in (HTTP {0}). Please try again in a few minutes.
auth.error.xbox.noAccount=This Microsoft account has no Xbox profile yet. Sign in once at https://www.xbox.com to create one (it is free), then try again.
auth.error.xbox.terms=This Microsoft account has not accepted the Xbox terms of use. Sign in at https://www.xbox.com and accept them, then try again.
auth.error.xbox.region=Xbox Live is not available in the country or region of this Microsoft account, so it cannot be used to play Minecraft.
auth.error.xbox.adultVerification=This account needs adult verification before it can use Xbox Live (required in South Korea). Complete it at https://account.xbox.com, then try again.
auth.error.xbox.child=This is a child account. An adult must add it to a Microsoft family group at https://account.microsoft.com/family before it can sign in.
auth.error.xbox.parentalControls=Family settings on this account do not allow online play. A parent can change this at https://account.microsoft.com/family.
auth.error.xbox.banned=Xbox has suspended this account, so it cannot sign in to Minecraft.
auth.error.xbox.other=Xbox Live refused the sign-in (error {0}). Check your account at https://account.xbox.com, then try again.
auth.error.minecraftLogin=Minecraft''s servers refused the sign-in (HTTP {0}). Please try again later.
auth.error.notOwned=This Microsoft account does not own Minecraft: Java Edition. Sign in with the account that bought it, or get the game at https://www.minecraft.net.
auth.error.noProfile=This account owns Minecraft: Java Edition but has no player name yet. Set one up at https://www.minecraft.net/msaprofile, then sign in again.
auth.error.badResponse={0} sent a sign-in answer Shardlight Client couldn''t read. Please try again later.
auth.error.unknownAccount=That account is not signed in on this computer.
auth.error.profileChanged=The saved sign-in for {0} now belongs to a different Minecraft profile. Please sign in again.
auth.error.secretStore=Couldn''t use {0} to keep your sign-in ({1}).
auth.error.signOutSecrets=You were signed out, but the saved sign-in couldn''t be removed from {0}. You can delete the "Shardlight Client" entries there yourself.
