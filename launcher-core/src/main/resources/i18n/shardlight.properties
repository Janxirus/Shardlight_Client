# ------------------------------------------------------------------ preset settings: Shardlight UI
preset.setting.ui.performanceMode.label=Performance mode
preset.setting.ui.performanceMode.description=Lighter drawing for low-end computers: reduced motion and effects, decorative work skipped.
preset.setting.ui.reducedEffects.label=Reduced effects
preset.setting.ui.reducedEffects.description=No particles, glows or flashes.
preset.setting.ui.menuEmbers.label=Menu embers
preset.setting.ui.menuEmbers.description=Glowing embers drift up behind the pause menu and title screen. Costly while a menu is open.
preset.setting.ui.themedParticles.label=Themed menu particles
preset.setting.ui.themedParticles.description=Menu particles change with the theme (embers, snow, leaves, petals).
preset.setting.ui.clickFx.label=Click bursts
preset.setting.ui.clickFx.description=A themed burst where you click a button or a slot.
preset.setting.ui.buttonFx.label=Button accents
preset.setting.ui.buttonFx.description=A themed accent on the hovered button.
preset.setting.ui.damageNumbers.label=Damage numbers
preset.setting.ui.damageNumbers.description=Numbers float up when you deal or take damage.
preset.setting.ui.themeFrames.label=Theme frames
preset.setting.ui.themeFrames.description=Themes with their own frame shape draw it; off uses the classic glass box everywhere.
preset.setting.ui.themeDecor.label=Theme ornaments
preset.setting.ui.themeDecor.description=Living ornaments around menus: cogs, torches, neon, thorns, icicles. The most expensive decoration.
preset.setting.ui.rarityTooltips.label=Rarity tooltip frames
preset.setting.ui.rarityTooltips.description=Item tooltips get a frame by rarity (needs the resource pack).
preset.setting.ui.itemRarityBorders.label=Rarity borders in inventories
preset.setting.ui.itemRarityBorders.description=A thin coloured frame around uncommon, rare and epic items in inventories.
preset.setting.ui.reducedMotion.label=Reduced motion
preset.setting.ui.reducedMotion.description=Animations snap into place instead of sliding.
preset.setting.ui.animationIntensity.label=Animation intensity
preset.setting.ui.animationIntensity.description=0 is still, 1 is normal, 2 is lively.
preset.setting.ui.screenAnimation.label=Menu open animation
preset.setting.ui.screenAnimation.description=Menus and inventories rise in out of a dark fade when opened.
preset.setting.ui.screenAnimMillis.label=Menu animation length
preset.setting.ui.screenAnimMillis.description=How long the menu open animation takes, in milliseconds (80 to 500).
preset.setting.ui.hoverAnim.label=Item hover animation
preset.setting.ui.hoverAnim.description=Hovered items: off, pop (grow a little), lift, glow or all.
preset.setting.ui.hoverAnimMillis.label=Hover animation length
preset.setting.ui.hoverAnimMillis.description=How long the hover animation takes, in milliseconds (40 to 400).
preset.setting.ui.hoverAnimIntensity.label=Hover animation strength
preset.setting.ui.hoverAnimIntensity.description=How strong the hover animation is, from 0 to 2.
preset.setting.ui.smoothHotbar.label=Smooth hotbar
preset.setting.ui.smoothHotbar.description=The selected-slot frame glides between slots.
preset.setting.ui.smoothScroll.label=Smooth scrolling
preset.setting.ui.smoothScroll.description=Lists glide when you scroll.
preset.setting.ui.buttonLift.label=Button lift
preset.setting.ui.buttonLift.description=Buttons lift a little when you hover them.
preset.setting.ui.tooltipEaseIn.label=Tooltip ease-in
preset.setting.ui.tooltipEaseIn.description=Tooltips rise in smoothly when they appear.
preset.setting.ui.chatSmoothLines.label=Smooth chat lines
preset.setting.ui.chatSmoothLines.description=New chat lines slide and fade in.
preset.setting.ui.joinSlideIn.label=HUD slide-in
preset.setting.ui.joinSlideIn.description=The HUD slides in when you join a world.
preset.setting.ui.pickupPopups.label=Pickup pop-ups
preset.setting.ui.pickupPopups.description=Short pop-ups like +16 Iron Ingot when you pick things up.
preset.setting.ui.lowHealthVignette.label=Low health warning
preset.setting.ui.lowHealthVignette.description=Red glow at the screen edges when health is low. An essential warning: on in every preset.
preset.setting.ui.durabilityHud.label=Durability bars
preset.setting.ui.durabilityHud.description=Durability bars for armour and held items next to the hotbar. Essential: on in every preset.
preset.setting.ui.armorHud.label=Armour panel
preset.setting.ui.armorHud.description=A panel with your armour pieces and their durability. Essential: on in every preset.
preset.setting.ui.toolWarning.label=Tool break warning
preset.setting.ui.toolWarning.description=A red flash and sound when the tool in your hand is about to break. Essential: on in every preset.
preset.setting.ui.elytraWarning.label=Elytra warning
preset.setting.ui.elytraWarning.description=A warning when your elytra is about to break while flying. Essential: on in every preset.
preset.setting.ui.foodAirWarnings.label=Food and air warnings
preset.setting.ui.foodAirWarnings.description=The food bar and air bubbles get a warning when you are hungry or running out of air. Essential: on in every preset.

# ------------------------------------------------------------------ preset settings: Shardlight Map
preset.setting.map.scanSpeed.label=Map scan speed
preset.setting.map.scanSpeed.description=Chunks scanned per tick for the map (1 to 32). Lower is lighter but the map fills in more slowly.
preset.setting.map.radarRange.label=Radar range
preset.setting.map.radarRange.description=How far mobs, items and vehicles are shown on the map, in blocks (16 to 128).
preset.setting.map.terrainShading.label=Terrain shading
preset.setting.map.terrainShading.description=Height shading on the map.
preset.setting.map.biomeColors.label=Biome colours
preset.setting.map.biomeColors.description=Grass, leaves and water coloured by biome.
preset.setting.map.trail.label=Walking trail
preset.setting.map.trail.description=A fading line where you have walked.
preset.setting.map.smoothZoom.label=Smooth map zoom
preset.setting.map.smoothZoom.description=The world map glides between zoom levels; off changes in instant steps.
preset.setting.map.nightTint.label=Night tint
preset.setting.map.nightTint.description=The map darkens a little at night.
preset.setting.map.beacons.label=Waypoint beams
preset.setting.map.beacons.description=A light beam above waypoints, seen from far away.

# ------------------------------------------------------------------ preset settings: Shardlight Party
preset.setting.party.shareEvery.label=Position sharing interval
preset.setting.party.shareEvery.description=Seconds between position messages to far-away friends (10 to 120). Longer is lighter.
preset.setting.party.worldMarkers.label=Friend markers
preset.setting.party.worldMarkers.description=Names, distance and direction floating over far-away friends.

# ------------------------------------------------------------------ preset settings: Shardlight Companion
preset.setting.companion.zoomSmooth.label=Smooth zoom camera
preset.setting.companion.zoomSmooth.description=A smooth, cinematic camera while zoomed.
preset.setting.companion.centreGuides.label=Builder centre guides
preset.setting.companion.centreGuides.description=Centre lines when both measuring tape points are set.

# ------------------------------------------------------------------ preset settings: Minecraft video options (opt-in)
preset.setting.vanilla.graphicsMode.label=Graphics
preset.setting.vanilla.graphicsMode.description=Minecraft graphics mode: fast, fancy or fabulous. Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.renderDistance.label=Render distance
preset.setting.vanilla.renderDistance.description=How many chunks are drawn (2 to 32). Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.simulationDistance.label=Simulation distance
preset.setting.vanilla.simulationDistance.description=How many chunks around you keep running (5 to 32). Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.particles.label=Particles
preset.setting.vanilla.particles.description=All, decreased or minimal particles. Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.entityShadows.label=Entity shadows
preset.setting.vanilla.entityShadows.description=Shadows under mobs and items. Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.ao.label=Smooth lighting
preset.setting.vanilla.ao.description=Ambient occlusion on blocks. Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.biomeBlendRadius.label=Biome blend
preset.setting.vanilla.biomeBlendRadius.description=How smoothly biome colours blend (0 to 7). Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.maxFps.label=Max frame rate
preset.setting.vanilla.maxFps.description=The frame rate limit; 260 means unlimited. Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.enableVsync.label=VSync
preset.setting.vanilla.enableVsync.description=Sync frames to the monitor. Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.mipmapLevels.label=Mipmap levels
preset.setting.vanilla.mipmapLevels.description=Texture smoothing at a distance (0 to 4). Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.renderClouds.label=Clouds
preset.setting.vanilla.renderClouds.description=Fancy, fast or no clouds. Option name verified for Minecraft 1.21.x; verify on 26.3.
preset.setting.vanilla.entityDistanceScaling.label=Entity distance
preset.setting.vanilla.entityDistanceScaling.description=How far away mobs and items are drawn (50% to 500%). Option name verified for Minecraft 1.21.x; verify on 26.3.

