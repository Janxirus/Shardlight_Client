# ------------------------------------------------------------------ modules
shardlight.module.ui.name=Shardlight UI
shardlight.module.ui.description=A full themed UI overhaul: glass HUD panels you can move, 15 themes with their own frame shapes, chat tabs and search, inventory sorting, a block info tooltip and smooth menus. Best with the Shardlight UI and Shardlight Sounds resource packs.
shardlight.module.map.name=Shardlight Map
shardlight.module.map.description=A themed minimap and world map with saved waypoints, death points and in-world markers. With Shardlight UI it uses your theme, moves in the HUD layout editor and shows its waypoints on the compass.
shardlight.module.party.name=Shardlight Party
shardlight.module.party.description=A friends list and party panel. Friends who both have the mod see each other on the HUD, the map and the compass from anywhere on the server. Client-side only, no server plugin needed.
shardlight.module.companion.name=Shardlight Companion
shardlight.module.companion.description=Journal, Lens, Builder and Timers: notes pinned to places, to-do lists, session stats, zoom and photo mode, a measuring tape and shape planner, and furnace, breeding and day/night timers.
shardlight.dependency.fabricApi.reason=Every Shardlight module needs Fabric API.
shardlight.module.unknown=There is no Shardlight module called “{0}”.
shardlight.theme.unknown=There is no Shardlight theme called “{0}”.
shardlight.catalog.invalid=The built-in list of Shardlight modules is damaged ({0}). Please reinstall Shardlight Client.

