# ------------------------------------------------------------------ presets
preset.ultra_performance.name=Ultra Performance
preset.ultra_performance.description=The cheapest functional look: no decorative particles, glows or theme ornaments, minimal animation and the slowest sensible map scanning. Health, armour, durability and food warnings stay on.
preset.performance.name=Performance
preset.performance.description=Lightweight themes with minimal animations and decorations, and conservative map updates.
preset.balanced.name=Balanced
preset.balanced.description=The mods as their authors set them up: smooth, inexpensive animations, clean themes and sensible map detail. The default.
preset.quality.name=Quality
preset.quality.description=More decorations, smoother transitions and the optional effects switched on.
preset.ultra_quality.name=Ultra Quality
preset.ultra_quality.description=Every supported detail and effect at its highest setting.
preset.custom.name=Custom
preset.custom.description=Your own choices: Balanced plus every setting you changed yourself.
preset.ultra_quality.warning=Ultra Quality turns on every effect and the longest animations. It costs the most performance and can lower your frame rate on slower computers.
preset.apply.nothingToApply=This project has no Shardlight modules and Minecraft video settings are not included, so there was nothing to write. The preset is remembered for later.
preset.apply.optionsMissing=Minecraft video settings were not changed because options.txt does not exist yet. Start the game once, then apply the preset again.
preset.apply.configUnreadable={0} isn''t valid JSON, so the preset left it alone. Fix or delete the file and apply again.
preset.custom.ignoredOverride=Your custom value for {0} isn''t valid any more and was ignored.
preset.revert.nothing=No preset has been applied to this project yet, so there is nothing to undo.
preset.revert.unreadable=The record of the last preset ({0}) can''t be read, so it can''t be undone. The backups are in config/shardlight/backups.
preset.revert.skipped=Skipped {0}: it isn''t a setting this launcher controls.
preset.revert.fileGone={0} no longer exists, so its settings were not restored.
