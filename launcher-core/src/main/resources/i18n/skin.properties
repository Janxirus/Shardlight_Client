skin.error.notPng=That file is not a skin. A skin is a PNG picture.
skin.error.size=That picture is {0} x {1} pixels. Minecraft skins are 64 x 64 (or the older 64 x 32).
skin.error.capeSize=That picture is {0} x {1} pixels. A cape is 64 x 32 (or a larger copy with the same shape).
skin.error.badTexture=Minecraft sent a skin picture the launcher does not trust, so it was not loaded.
skin.error.notInLibrary=That skin is no longer in your library.
skin.error.rejected=Minecraft did not accept that skin. Check that it is a 64 x 64 or 64 x 32 PNG.
skin.error.denied=Minecraft refused the request (HTTP {0}). Sign in again from Settings > Accounts and retry.
skin.error.noProfile=This account has no Minecraft: Java Edition profile, so it has no skin to change.
skin.error.rateLimited=Minecraft asks for a pause. Wait a minute and try again.
skin.error.status=Minecraft''s servers answered with an error (HTTP {0}). Try again in a few minutes.
